<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Takeout | Google Chat Reader</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f9fafb;
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 40px;
      }

      /* Main container */
      .container {
        background: #ffffff;
        border-radius: 16px;
        padding: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      /* Header */
      .page_header {
        padding: 20px 30px;
        font-size: 22px;
        font-weight: 600;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .page_header img {
        height: 40px;
      }

      /* Center content */
      .main-section {
        text-align: center;
        padding: 50px 20px;
      }

      /* Upload Card */
      .first_block {
        background: #ffffff;
        width: 500px;
        margin: 0 auto;
        border-radius: 16px;
        padding: 30px;
        border: 1px dashed #d1d5db;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      }

      /* Folder icon */
      .folderImg {
        height: 60px;
        margin-bottom: 15px;
      }

      /* Button */
      #select-directory {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        color: white;
        font-weight: 500;
        margin-top: 10px;
      }

      #select-directory:hover {
        opacity: 0.9;
      }

      /* Input-like path box */
      #chat_header {
        background-color: #198754;
        color: #fff;
        display: none;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 10px;
      }

      #chat_header {
        background-color: #198754;
        color: #fff;
        display: none;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 10px;
      }
      #chat {
        white-space: pre-wrap;
        padding: 10px;
        font-size: 11pt;
        border: 1px solid #000;
        margin-bottom: 30px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        width: 100%;
      }
      #chat img.thumbnail {
        max-width: 40%;
      }
      #chat div.reactions {
        background-color: #efefef;
        display: inline-block;
        margin-left: 3pt;
      }
      #chat div.reactions p {
        margin: 0;
        padding: 3pt 3pt 0 3pt;
        display: inline-block;
      }
      .nav {
        padding: 6pt;
        background-color: #ececec;
      }
      .nav.top {
        margin-bottom: 10pt;
      }

      /* Instructions */
      .instructions {
        margin-top: 40px;
        width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      .instructions p {
        font-weight: 600;
        margin-bottom: 10px;
      }

      .instructions ol {
        padding-left: 20px;
      }

      .instructions li {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Icons */
      .tick,
      .bulb {
        height: 18px;
      }

      #chatList {
        min-height: 150px;
        max-height: 953px;
        overflow-y: auto;
        border: 1px dashed #ccc;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        margin-left: 40px;
      }

      #chatSection {
        display: none;
      }

      .list-group-item:hover {
        background-color: rgb(207, 247, 207);
      }

      .list-group-item a:hover {
        color: rgb(1, 79, 1);
        font-weight: bold;
        font-size: medium;
      }

      #chat {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 150px;
        max-height: 900px;
        overflow-y: auto;
      }

      /* message bubble */
      .message {
        max-width: 70%;
        padding: 10px;
        border-radius: 10px;
      }

      /* right side (you) */
      .message.sent {
        align-self: flex-end;
        background-color: #d1fae5;
      }

      /* left side (other person) */
      .message.received {
        align-self: flex-start;
        background-color: #f3f4f6;
      }

      /* meta */
      .meta {
        font-size: 11px;
        color: gray;
        margin-bottom: 5px;
      }

      /* images */
      .thumbnail {
        max-width: 200px;
        border-radius: 6px;
        margin-top: 5px;
      }

      /* reactions */
      .reactions {
        display: flex;
        gap: 5px;
        margin-top: 5px;
      }
    </style>
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="row header_container">
        <h1 class="page_header">
          Google Takeout | Google Chat Reader
          <img
            src="https://github.com/mrwoof/google-chat-takeout-reader/blob/main/static/img/chat-reader-logo.png?raw=true"
            alt="Chat Reader"
          />
        </h1>
      </div>

      <!-- Upload Section (Your New UI) -->
      <div class="main-section text-center">
        <h3>Upload Takeout Data</h3>
        <p style="color: #6b7280">Drag & drop your folder OR</p>

        <div class="first_block">
          <img src="./static/img/folderImg.jpg" class="folderImg" />

          <p>Drag & drop your folder</p>

          <!-- IMPORTANT: same button id -->
          <button id="select-directory" class="btn btn-success">
            Select Takeout Directory
          </button>

          <p style="margin-top: 10px; font-size: 13px; color: #6b7280">
            Supports: Google Takeout
          </p>
        </div>
      </div>

      <!-- Chat Section (Original Working Layout) -->
      <div class="row mt-4">
        <!-- Chat List -->
        <div class="col-md-4">
          <ul id="chatList" class="list-group">
            <i>Choose the directory of uncompressed Takeout files</i>
          </ul>
        </div>

        <!-- Chat Messages -->
        <div class="col-md-7">
          <h5 id="chat_header"></h5>
          <div id="chat" class="border rounded p-2 text-break"></div>
        </div>
      </div>
    </div>

    <script>
      const chatMetadataEntries = {};
      const chatMessageFiles = {};
      const fileCache = {};
      const imgCache = {};
      const chatMessageCache = {};

      const extensionRegex = /\.[0-9a-z]+$/i;

      async function addChatMetadataEntry(itemPath, entry) {
        const file = await entry.getFile();
        const text = await file.text();
        const json = JSON.parse(text);

        const chatId = getDirectoryName(itemPath);
        chatMetadataEntries[chatId] = { members: json.members };
        if ("name" in json) {
          chatMetadataEntries[chatId].name = json.name;
        }

        // set up imgCache for this chatId
        imgCache[chatId] = {};
      }

      function escapeFilename(filename) {
        if (!extensionRegex.test(filename)) {
          // default to jpg. some extensions are missing in messagess.json
          // but the files exported have .jpg ext
          filename += ".jpg";
        }
        return filename.replace(/[\?:]/g, "_");
      }

      function convertImageFilename(chatId, filename) {
        let imgFile = escapeFilename(filename);
        imgCache[chatId][imgFile] = (imgCache[chatId][imgFile] || 0) + 1;

        if (imgCache[chatId][imgFile] > 1) {
          let imgIdx = imgCache[chatId][imgFile] - 1;
          let imgExt = imgFile.substring(imgFile.lastIndexOf("."));
          let imgBase = imgFile.substring(0, imgFile.lastIndexOf("."));
          imgFile = `${imgBase}(${imgIdx})${imgExt}`;
        }

        return imgFile;
      }

      function getDirectoryName(filePath) {
        const parts = filePath.split("/");

        // Return the second-to-last element
        if (parts.length < 2) {
          return ".";
        }

        return parts[parts.length - 2].replace(/\s/g, "-");
      }

      function addChatMessagesEntry(itemPath, entry) {
        const chatId = getDirectoryName(itemPath);
        chatMessageFiles[chatId] = entry;
      }

      function formatTimestamp(timestamp) {
        if (timestamp == undefined) {
          return "";
        }

        // Format is "Thursday, July 14, 2016 at 5:04:34 PM UTC"
        timestamp = timestamp.replace(" at ", " ");
        const date = new Date(timestamp);
        return date.toLocaleString();
      }

      async function addToFileCache(itemPath, entry) {
        const chatId = getDirectoryName(itemPath);

        // initialize fileCache for this chatId
        if (!(chatId in fileCache)) {
          fileCache[chatId] = {};
        }

        file = await entry.getFile();
        fileCache[chatId][entry.name] = file;
      }

      function getImgSrcPath(chatId, filename) {
        const file = fileCache[chatId][filename];
        try {
          return URL.createObjectURL(file);
        } catch (e) {
          console.error(e);
          return "";
        }
      }

      function getChatMembersTitle(chatId) {
        if (chatMetadataEntries[chatId] == undefined) {
          // TODO what the hell?
          return "unknown";
        }

        if ("name" in chatMetadataEntries[chatId]) {
          return chatMetadataEntries[chatId].name;
        }

        return getChatMembers(chatId).join(" • ");
      }

      function getChatMembers(chatId) {
        if (chatMetadataEntries[chatId] == undefined) {
          // TODO what the hell?
          return [];
        }

        return chatMetadataEntries[chatId].members.map((member) => member.name);
      }

      function showOptsForm(chatId) {
        $("#opts-" + chatId).toggle();
      }

      function preprocessImages(chatId, msgsJson) {
        for (const msg of msgsJson.messages) {
          if (!("attached_files" in msg)) {
            continue;
          }
          for (const file of msg.attached_files) {
            // console.log("image file before: ", file);
            const imgFile = convertImageFilename(chatId, file.export_name);
            // console.log("converted filename: ", imgFile);
            file.export_name = imgFile;
          }
        }

        return msgsJson;
      }

      async function showChatList() {
        await pickDirectory();
        console.log("Chats loaded");

        const chatList = $("#chatList");

        if (Object.keys(chatMessageFiles).length == 0) {
          chatList.append(`<br><i>No chats found</i>`);
          return;
        }

        chatList.empty();
        chatList.append($('<h6 class="mt-3">Select chat to view</h6>'));
        for (const chatId in chatMessageFiles) {
          const listItem = $('<li class="list-group-item"></li>').html(
            `<a href="#" class="list_name" onclick="readAndDisplayJsonFile('${chatId}')">${getChatMembersTitle(chatId)}</a> <span class="show-opts badge"><a href="#" onclick="showOptsForm('${chatId}')">opts</a></span>`,
          );
          const formDiv = $(`<div class="chat-opts" id="opts-${chatId}"></div`);
          const formItem = $(
            `<form id="opts-form-${chatId}" onsubmit="readAndDisplayJsonFile('${chatId}')"></form>`,
          );
          formItem.append(`
                            <input type="checkbox" id="imagesOnly-${chatId}" name="imagesOnly" class="form-check-input">
                            <label for="imagesOnly">Images Only</label>`);
          for (const member of getChatMembers(chatId)) {
            formItem.append(`
                            <br>
                            <input type="checkbox" data-exclude-name="${member}" name="exclude" class="form-check-input">
                            <label for="exclude">Hide ${member} messages</label>`);
          }
          formDiv.append(formItem);
          formDiv.append(
            `<button class="opts-btn btn btn-success" onclick="readAndDisplayJsonFile('${chatId}')"">Apply</button>`,
          );
          listItem.append(formDiv);
          chatList.append(listItem);
        }
      }

      async function pickDirectory() {
        const chatList = $("#chatList");
        try {
          const directoryHandle = await window.showDirectoryPicker({
            startIn: "downloads",
          });
          $("#chat").empty();
          $("#chat_header").hide();
          chatList.html(`<i>Loading chats...</i>`);
          await listFilesRecursive(directoryHandle, chatList);
        } catch (err) {
          console.error(`Error: ${err}`);
          chatList.html(`<i>Error: ${err.message}</i>`);
        }
      }

      async function listFilesRecursive(
        directoryHandle,
        chatList,
        prefix = "",
      ) {
        console.log("Looking for chats in ", directoryHandle.name);
        for await (const entry of directoryHandle.values()) {
          const itemPath = `${prefix}${entry.name}`;
          // console.log("processing ", itemPath);
          if (entry.kind === "file") {
            if (entry.name.endsWith("messages.json")) {
              addChatMessagesEntry(itemPath, entry);
            } else if (entry.name.endsWith("group_info.json")) {
              addChatMetadataEntry(itemPath, entry);
            } else {
              await addToFileCache(itemPath, entry);
            }
          } else if (entry.kind === "directory") {
            if (entry.name.startsWith(".") || entry.name === "Users") {
              continue;
            }
            await listFilesRecursive(entry, chatList, itemPath + "/");
          }
        }
      }

      async function goToMessage(chatId) {
        const messageNum = $(`#goToMessage`).val().replace(/,/g, "");
        let i = parseInt(messageNum);

        if (isNaN(i)) {
          alert("Unfortunately not a number: " + messageNum);
          return;
        } else if (i < 1) {
          i = 0;
        }

        await readAndDisplayJsonFile(chatId, { start: i - 1 });
      }

      async function readAndDisplayJsonFile(chatId, opts = {}) {
        if (!(chatId in chatMessageCache)) {
          console.log(`Reading and parsing ${chatId} messages.json`);
          const entry = chatMessageFiles[chatId];

          $("#chat_header").text(getChatMembersTitle(chatId)).show();

          const chatBox = document.getElementById("chat");
          chatBox.innerHTML = "<i>Loading messages...</i>";

          const file = await entry.getFile();
          const text = await file.text();
          chatMessageCache[chatId] = preprocessImages(chatId, JSON.parse(text));
        }

        window.scrollTo(0, 0);

        const chatBox = document.getElementById("chat");
        chatBox.innerHTML = "";

        const json = chatMessageCache[chatId];
        const max = Math.min(5000, json.messages.length);

        const imagesOnly = $(`#imagesOnly-${chatId}`).is(":checked");

        let excludeSenders = {};
        for (const member of getChatMembers(chatId)) {
          if (
            $(`#opts-form-${chatId} input[data-exclude-name="${member}"]`).is(
              ":checked",
            )
          ) {
            excludeSenders[member] = true;
          }
        }

        let start = "start" in opts ? opts.start : 0;
        if (start >= json.messages.length) {
          start = json.messages.length - max;
        }

        const end = Math.min(start + max, json.messages.length);

        console.log(`Displaying ${max} messages from ${start} to ${end}`);

        for (let i = start; i < end; i++) {
          const msg = json.messages[i];

          if (msg.creator.name in excludeSenders) continue;
          if (imagesOnly && !("attached_files" in msg)) continue;

          // ===== MESSAGE DIV =====
          const messageDiv = document.createElement("div");
          messageDiv.className =
            msg.creator.name === "Aarohi Verma"
              ? "message sent"
              : "message received";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `<b>${msg.creator.name}</b> ${formatTimestamp(
            msg.created_date,
          )}`;

          // TEXT
          const textDiv = document.createElement("div");
          textDiv.className = "text";

          if (msg.text) {
            textDiv.innerText = msg.text;
          }

          // ATTACHMENTS
          if (msg.attached_files) {
            msg.attached_files.forEach((file) => {
              const imgSrc = getImgSrcPath(chatId, file.export_name);

              const img = document.createElement("img");
              img.src = imgSrc;
              img.className = "thumbnail";

              const link = document.createElement("a");
              link.href = imgSrc;
              link.target = "_blank";
              link.appendChild(img);

              textDiv.appendChild(link);
            });
          }

          // REACTIONS
          if (msg.reactions) {
            const reactionsDiv = document.createElement("div");
            reactionsDiv.className = "reactions";

            msg.reactions.forEach((r) => {
              const emoji = document.createElement("span");
              emoji.innerText = r.emoji.unicode;
              emoji.title = r.reactor_emails;
              reactionsDiv.appendChild(emoji);
            });

            textDiv.appendChild(reactionsDiv);
          }

          // FINAL APPEND
          messageDiv.appendChild(meta);
          messageDiv.appendChild(textDiv);
          chatBox.appendChild(messageDiv);
        }
      }

      $(document).ready(function () {
        $("#select-directory").click(showChatList);
      });
    </script>
  </body>
</html>
